name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzar el despliegue a mano desde la pestaña Actions.
  workflow_dispatch:

# Permisos minimos que exige el despliegue a Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. No cancela el que ya esta corriendo, para no dejar
# el sitio a medio publicar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar sitio
    runs-on: ubuntu-latest
    env:
      # ---------------------------------------------------------------
      # CAMBIO DE DOMINIO
      #
      # Hoy (temporal):   https://luexi.github.io/MDO
      #   PUBLIC_SITE_URL:  https://luexi.github.io
      #   PUBLIC_BASE_PATH: /MDO
      #
      # Al activar el dominio propio, sustituir por:
      #   PUBLIC_SITE_URL:  https://maestriaendirecciondeorganizaciones.uagro.mx
      #   PUBLIC_BASE_PATH: /
      # y crear el archivo public/CNAME con el dominio dentro.
      # ---------------------------------------------------------------
      PUBLIC_SITE_URL: https://luexi.github.io
      PUBLIC_BASE_PATH: /MDO
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar lint
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
