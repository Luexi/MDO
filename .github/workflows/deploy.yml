name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzar el despliegue a mano desde la pestaña Actions.
  workflow_dispatch:

# Permisos minimos que exige el despliegue a Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. No cancela el que ya esta corriendo, para no dejar
# el sitio a medio publicar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar sitio
    runs-on: ubuntu-latest
    env:
      # ---------------------------------------------------------------
      # CAMBIO DE DOMINIO
      #
      # SITE_URL y BASE_PATH dicen desde donde sirve ESTA compilacion.
      # CANONICAL_URL dice cual de los destinos deben indexar los buscadores,
      # y NO es este: es Vercel.
      #
      # El sitio publico de verdad es https://mdo-alpha.vercel.app, porque el QR
      # del cartel impreso apunta ahi y porque
      # maestriadirecciondeorganizaciones.uagro.mx redirige ahi. Esta
      # compilacion de GitHub Pages existe pero nadie la enlaza, asi que declara
      # el canonico de Vercel para no competir por la indexacion.
      # La explicacion completa esta en src/lib/seo.ts.
      #
      # Cuando el area de sistemas haga que el dominio de la UAGro SIRVA el
      # sitio en vez de redirigir, sustituir por:
      #   PUBLIC_SITE_URL:      https://maestriadirecciondeorganizaciones.uagro.mx
      #   PUBLIC_BASE_PATH:     /
      #   PUBLIC_CANONICAL_URL: https://maestriadirecciondeorganizaciones.uagro.mx
      # y crear el archivo public/CNAME con el dominio dentro.
      #
      # Ademas hay que actualizar, en la misma tanda, los otros tres sitios que
      # declaran el canonico (los usa el despliegue de Vercel, que no lee estas
      # variables):
      #   - src/lib/seo.ts
      #   - astro.config.mjs
      #   - la linea `Sitemap:` de public/robots.txt
      # ---------------------------------------------------------------
      PUBLIC_SITE_URL: https://luexi.github.io
      PUBLIC_BASE_PATH: /MDO
      PUBLIC_CANONICAL_URL: https://mdo-alpha.vercel.app
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar lint
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
